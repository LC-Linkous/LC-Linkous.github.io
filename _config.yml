title: lc-linkous.github.io
description: >-
  not-a-blog with tutorials/examples for projects shared on GitHub that have
  additional hardware or physical components. Academic research and project
  highlights included
url: "https://lc-linkous.github.io"
author: Lauren Linkous

# GitHub Pages injects jekyll-theme-primer when no theme is set; declare it so
# the dependency is visible. Every layout this site uses (default, post, tags)
# is defined in _layouts/, so nothing from the theme is actually rendered.
theme: jekyll-theme-primer

markdown: kramdown

plugins:
  - jekyll-feed

collections:
  tags:
    output: true
    permalink: tags/:path/

# Jekyll processes everything under the site root.
exclude:
  - README.md
  - scripts/
