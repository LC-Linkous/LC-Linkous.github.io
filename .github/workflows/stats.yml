# Nightly: refresh _data/stats.yml from the GitHub and PyPI APIs and commit
# it if anything changed. The home page renders the numbers at build time;
# nothing runs in the visitor's browser.
name: Update site stats

on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC daily (01:17 / 02:17 Eastern)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: site-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stats.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- _data/stats.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change."
          else
            git config user.name  "stats-bot"
            git config user.email "stats-bot@users.noreply.github.com"
            git add _data/stats.yml
            git commit -m "stats: nightly update $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not always start a Pages build on
      # their own, so request one explicitly when the data changed.
      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request failed (will deploy on next push)."
